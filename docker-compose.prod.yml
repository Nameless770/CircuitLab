# CircuitLab on a server. Laid over docker-compose.yml, this file:
#   - adds Caddy, the only thing reachable from the internet: HTTPS in front of the API;
#   - runs the API as several copies (API_COPIES, two by default), and gives sign-ins and
#     registrations copies of their own (API_AUTH_COPIES, one by default). Caddy shares the requests
#     out between them (deploy/Caddyfile): docs/system-design.md, stage 2;
#   - refuses to start without real secrets (JWT_SECRET, POSTGRES_PASSWORD) and a SITE_ADDRESS;
#   - tells the API it is behind one proxy (TRUST_PROXY) and limits sign-ins and registrations per
#     address (AUTH_RATE_LIMIT): docs/system-design.md measured why;
#   - gives Redis a memory limit, and the result cache a Redis of its own that may forget old
#     entries, apart from the one that holds the job queue and must never lose a key.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# docs/deploy.md has the steps, from an empty machine to a running site. Settings come from a .env
# file next to this one (see .env.example).

# What every copy of the API has in common. A copy keeps nothing of its own: accounts, circuits and
# history are in PostgreSQL, and the cache, the throttle and the jobs are in Redis, so a request can go
# to any copy. The one thing they must agree on is the key that signs the tokens.
x-api-environment: &api-environment
  DATABASE_URL: postgresql://circuitlab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/circuitlab
  # Without a key of its own the API makes a random one at every start: everyone is signed out at
  # each restart, and a copy would reject the tokens of another.
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random characters (see .env.example)}
  REDIS_CACHE_URL: redis://redis-cache:6379
  # One proxy (Caddy) stands in front: believe its X-Forwarded-For, so that the throttle and the
  # address limit see each client's own address and not Caddy's.
  TRUST_PROXY: "1"
  # Sign-ins and registrations one address may make in a minute (each costs a password hash). The
  # count is in Redis, so it holds across copies. Behind a shared address, such as a school's,
  # raise it (see docs/deploy.md).
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}

services:
  # HTTPS in front of the API. For a real domain name it gets a certificate from Let's Encrypt, and
  # renews it. Port 80 must be open too: that is where Let's Encrypt checks you own the name. It also
  # shares the requests out between the copies of the API.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env to your domain name, such as demo.example.com (see docs/deploy.md)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates. Keeping them across restarts matters: Let's Encrypt limits how many a
      # name may get.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      api-auth:
        condition: service_healthy
    # Caddy writes a line for every request (its access log). Docker keeps a container's log without
    # limit unless told to: this keeps the last 30 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, letters and digits only (see .env.example)}

  # The job queue, the sign-in throttle and job results. It must never lose a key, so it never
  # evicts (noeviction); and it has a size limit, so that it can't fill the machine.
  redis:
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]

  # The result cache, in a Redis of its own. When it is full it forgets the oldest entries
  # (allkeys-lru), which is right for a cache and wrong for the queue. Nothing in it is kept on disk.
  redis-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: postgresql://circuitlab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/circuitlab

  # The API: every request but sign-in and registration. Copies of one container, which Caddy finds
  # by the service's name (Docker's DNS gives one address per copy). More or fewer: API_COPIES.
  api:
    # Only Caddy is published. The API itself isn't reachable from outside the Compose network.
    ports: !reset []
    deploy:
      replicas: ${API_COPIES:-2}
    environment: *api-environment
    depends_on:
      redis-cache:
        condition: service_healthy

  # The same image, for sign-ins and registrations only (Caddy routes /v1/auth/* here). Each one
  # costs a password hash, about 28 ms of a CPU: a burst of them, such as a class signing in at the
  # start of a lab, keeps these copies busy and can't slow the ones that serve everyone else.
  api-auth:
    build: .
    image: circuitlab
    deploy:
      replicas: ${API_AUTH_COPIES:-1}
    environment:
      <<: *api-environment
      REDIS_URL: redis://redis:6379
      JOB_CONCURRENCY: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      # The same as the API's in docker-compose.yml: /health, which asks the database and Redis too.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    environment:
      DATABASE_URL: postgresql://circuitlab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/circuitlab
      REDIS_CACHE_URL: redis://redis-cache:6379
    depends_on:
      redis-cache:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
